
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> fetch--2 </title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css" integrity="sha512-nMJjQudb6RMMr08oY6YSfNlEWl1l8XWuoOwNvtWXrrgVs8MCR8AZBB1tEAO+ogiI93gXtG1XPmg+bAP5DochSA==" crossorigin="anonymous" referrerpolicy="no-referrer">
     <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col-md-5 mb-5 mt-5">
                <div class="card">
                    <div class="card-header bg-success">
                        <h4 class="text-center text-white"> Submit Todo </h4>
                    </div>
                    <div class="card-body">
                        <form id="todoform">
                            <div class="form-group shadow">
                                <lable for="todoInput"> Todo Item </lable>
                                <input type="text" required id="todoInput" class="form-control">
                            </div>
                            <button class="btn btn-sm btn-block bg-primary text-white" id="addtodo">Add Todo</button>
                            <button class="btn btn-sm btn-block d-none bg-info" id="updatetodo" type="button"> Update Todo</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mt-5">
                <div class="card">
                    <div class="card-header text-center text-white bg-success">
                        <h3> All Todos </h3>
                    </div>
                    <div class="card-body">
                        <ul class="list-group" id="todoContainer">
                            <!-- <li class="list-group-item d-flex justify-content-between">
                                <div> <strong> HTML </strong>
                                    <button class="btn btn-sm btn-outline-info">Edit</button>
                                    <button class="btn btn-sm btn-outline-danger">Delete</button>
                                </div>
                            </li> -->
                        </ul>
                    </div>  
                </div>
            </div>
        </div>
    </div>

    <div id="spinner" class="spinner d-none">
        <button class="btn btn-primary" type="button" disabled>
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
             Loading....
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
